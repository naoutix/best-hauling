name: CI (tests)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # actions/checkout écrit sinon le GITHUB_TOKEN en clair dans .git/config du workspace,
          # là même où tournent ensuite du code de test et des dépendances tierces. Ce job ne
          # pousse rien : il n'a aucun besoin de ce token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      - name: Tests unitaires (fonctions pures)
        run: node --test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # actions/checkout écrit sinon le GITHUB_TOKEN en clair dans .git/config du workspace,
          # là même où tournent ensuite du code de test et des dépendances tierces. Ce job ne
          # pousse rien : il n'a aucun besoin de ce token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      # `npm install` ne vérifie pas que package-lock.json est en phase avec package.json : quand il
      # ne l'est plus — un bump de plage oublié dans une PR, par exemple — il résout un arbre neuf,
      # ignore les hashes d'intégrité verrouillés et réécrit le lock dans le runner, en exécutant au
      # passage les scripts postinstall de versions que personne n'a relues. Le job passe au vert et
      # le badge CI atteste d'un arbre que rien n'a validé. `npm ci` échoue bruyamment à la place.
      - name: Installer les dépendances de test
        run: npm ci --no-audit --no-fund
      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E de fumée
        run: npx playwright test

      # `test-results/` (trace du retry, snapshot ARIA) et `playwright-report/` sont gitignorés et
      # meurent avec le runner : sans téléversement, un échec CI ne laisse que la sortie texte du
      # reporter `list`. On ne téléverse que sur échec — un job vert n'a rien à archiver.
      - name: Traces Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
